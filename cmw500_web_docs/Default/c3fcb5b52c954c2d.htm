				</style><meta http-equiv="X-UA-Compatible" content="IE=8"><link disabled="disabled" href="html_help.css" rel="stylesheet" type="text/css"><script src="nsr.js"></script></head><body><div id="nsr"><span><a class="chm-breadcrumb" href="4be496f6fa304ede.htm">Remote Control</a> &gt; <a class="chm-breadcrumb" href="a9421a8b4ae14b49.htm">Remote Control Operation</a> &gt; <a class="chm-breadcrumb" href="a16d531017d34ab5.htm">Remote Control Interfaces and Protocols</a> &gt; <span class="chm-breadcrumb">USB Interface</span></span></div><div id="mainbody"><div style="width: 95%"><a name="top"></a><a name="ID_5aec0c822d7b11dead26cbcbe05ff0ea-1e6393d850c4249f0a00206a01b79165-en-US"></a><a name="ID_5aee7d832d7b11dead26cbcbe05ff0ea-1e6393d850c4249f0a00206a01b79165-en-US"></a><a name="ID_dafb216c507a11e3a860e24dc0510fb0-1e6393d850c4249f0a00206a01b79165-en-US"></a><div class="chm-chaptertitle">USB Interface</div><p>A USB type B connector labeled USB REMOTE is available on the rear panel. Connect the control computer to this USB connector. VISA must be installed on the control computer.</p><div class="chm-go-to-top"><span><a class="chm-go-to-top" href="#top">Top</a></span></div></div></div></body></html>
