				</style><meta http-equiv="X-UA-Compatible" content="IE=8"><link disabled="disabled" href="html_help.css" rel="stylesheet" type="text/css"><script src="nsr.js"></script></head><body><div id="nsr"><span><a class="chm-breadcrumb" href="4be496f6fa304ede.htm">Remote Control</a> &gt; <a class="chm-breadcrumb" href="74454276884a411d.htm">Device Messages</a> &gt; <a class="chm-breadcrumb" href="ae5c09fa0dc447d8.htm">SCPI Command Structure and Syntax</a> &gt; <a class="chm-breadcrumb" href="d7c1bad77fd14fcf.htm">SCPI Parameters</a> &gt; <span class="chm-breadcrumb">Strings</span></span></div><div id="mainbody"><div style="width: 95%"><a name="top"></a><a name="shiv_rs_cmw_500_6586-661a10f050c4227c0a00206a01b79165-en-US"></a><div class="chm-chaptertitle">Strings</div><p>Strings must be entered within single or double quotation marks (' or ").</p><p><b>Example</b>: <span class="command">MMEM:MDIR 'C:\test scripts'</span> or <span class="command">MMEM:MDIR "C:\test scripts"</span></p><div class="chm-go-to-top"><span><a class="chm-go-to-top" href="#top">Top</a></span></div></div></div></body></html>
